services:
  casino:
    build: .
    image: casino-game:latest
    container_name: casino-game
    env_file:
      - .env
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - casino_data:/app/data
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  casino_data:
    name: casino_game_data
