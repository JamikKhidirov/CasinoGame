<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 470" preserveAspectRatio="xMidYMid meet" style="max-width:1000px;height:auto;display:block" role="img" aria-label="Поток событий игрового бэкенда: клиент, Socket.io, комната, SQLite">
  <title>Как работает игровой бэкенд</title>
  <desc>Анимированная схема: клиент отправляет действие, сервер проверяет его в комнате, сохраняет состояние в SQLite и рассылает результат.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120">
        <animate attributeName="stop-color" values="#0b1120;#111a35;#0b1120" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#1a1745">
        <animate attributeName="stop-color" values="#1a1745;#241a5e;#1a1745" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="socketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="roomGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fcd34d"/>
    </marker>
  </defs>

  <rect width="1000" height="470" rx="22" fill="url(#bg)"/>

  <!-- заголовок -->
  <text x="500" y="44" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">
    Как работает онлайн-игра на бэкенде
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#93a3c4" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    клиент присылает намерение → сервер проверяет и меняет состояние → SQLite → ответ всем игрокам
  </text>

  <!-- связи -->
  <path d="M 210 170 H 290" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" opacity="0.75"/>
  <path d="M 470 170 H 550" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" opacity="0.75"/>
  <path d="M 730 170 H 810" stroke="#fcd34d" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowAmber)" opacity="0.75"/>
  <path d="M 730 210 C 730 285, 210 285, 210 210" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowGreen)" opacity="0.7"/>

  <!-- бегущие пакеты -->
  <circle r="6" fill="#bfdbfe" filter="url(#soft)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 210 170 H 290" begin="0s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="6" fill="#ddd6fe" filter="url(#soft)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 470 170 H 550" begin="0.9s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle r="6" fill="#fde68a" filter="url(#soft)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 730 170 H 810" begin="1.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite" begin="1.7s"/>
  </circle>
  <circle r="6" fill="#a7f3d0" filter="url(#soft)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 730 210 C 730 285, 210 210 210 210" begin="2.4s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite" begin="2.4s"/>
  </circle>

  <!-- клиент -->
  <g>
    <rect x="40" y="120" width="170" height="100" rx="16" fill="url(#clientGrad)" opacity="0.95"/>
    <rect x="40" y="120" width="170" height="100" rx="16" fill="none" stroke="#93c5fd" stroke-opacity="0.5"/>
    <text x="125" y="158" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🖥 Браузер</text>
    <text x="125" y="181" text-anchor="middle" fill="#dbeafe" font-family="Consolas, monospace" font-size="11">React + Socket.io</text>
    <text x="125" y="199" text-anchor="middle" fill="#bfdbfe" font-family="Consolas, monospace" font-size="10">playerAction</text>
  </g>

  <!-- socket -->
  <g>
    <rect x="290" y="120" width="180" height="100" rx="16" fill="url(#socketGrad)" opacity="0.95"/>
    <rect x="290" y="120" width="180" height="100" rx="16" fill="none" stroke="#c4b5fd" stroke-opacity="0.5"/>
    <text x="380" y="158" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🔌 Socket.io</text>
    <text x="380" y="181" text-anchor="middle" fill="#ede9fe" font-family="Consolas, monospace" font-size="11">Express · сессии</text>
    <text x="380" y="199" text-anchor="middle" fill="#ddd6fe" font-family="Consolas, monospace" font-size="10">join / startGame</text>
  </g>

  <!-- room -->
  <g>
    <rect x="550" y="120" width="180" height="100" rx="16" fill="url(#roomGrad)" opacity="0.95"/>
    <rect x="550" y="120" width="180" height="100" rx="16" fill="none" stroke="#6ee7b7" stroke-opacity="0.55"/>
    <text x="640" y="158" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🎲 Room</text>
    <text x="640" y="181" text-anchor="middle" fill="#d1fae5" font-family="Consolas, monospace" font-size="11">правила и ходы</text>
    <text x="640" y="199" text-anchor="middle" fill="#a7f3d0" font-family="Consolas, monospace" font-size="10">dice / blackjack / durak</text>
  </g>

  <!-- db -->
  <g>
    <rect x="810" y="120" width="150" height="100" rx="16" fill="url(#dbGrad)" opacity="0.95"/>
    <rect x="810" y="120" width="150" height="100" rx="16" fill="none" stroke="#fde68a" stroke-opacity="0.55"/>
    <text x="885" y="158" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">💾 SQLite</text>
    <text x="885" y="181" text-anchor="middle" fill="#fef3c7" font-family="Consolas, monospace" font-size="11">users · balance</text>
    <text x="885" y="199" text-anchor="middle" fill="#fde68a" font-family="Consolas, monospace" font-size="10">transactions · web_rooms</text>
  </g>

  <!-- подписи связей -->
  <text x="250" y="158" text-anchor="middle" fill="#bfdbfe" font-family="Consolas, monospace" font-size="10">намерение</text>
  <text x="510" y="158" text-anchor="middle" fill="#ddd6fe" font-family="Consolas, monospace" font-size="10">проверка</text>
  <text x="770" y="158" text-anchor="middle" fill="#fde68a" font-family="Consolas, monospace" font-size="10">saveRoom()</text>
  <text x="470" y="300" text-anchor="middle" fill="#a7f3d0" font-family="Consolas, monospace" font-size="10">broadcastRoom · каждому своё состояние</text>

  <!-- машина состояний -->
  <text x="40" y="350" fill="#93a3c4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">СОСТОЯНИЕ КОМНАТЫ</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="40" y="365" width="150" height="46" rx="23" fill="rgba(251,191,36,0.14)" stroke="rgba(251,191,36,0.55)">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="394" text-anchor="middle" fill="#fcd34d">WAITING</text>

    <rect x="290" y="365" width="150" height="46" rx="23" fill="rgba(52,211,153,0.14)" stroke="rgba(52,211,153,0.6)">
      <animate attributeName="fill-opacity" values="0.35;1;0.35" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <text x="365" y="394" text-anchor="middle" fill="#6ee7b7">PLAYING</text>

    <rect x="540" y="365" width="150" height="46" rx="23" fill="rgba(167,139,250,0.14)" stroke="rgba(167,139,250,0.6)">
      <animate attributeName="fill-opacity" values="0.35;1;0.35" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="394" text-anchor="middle" fill="#c4b5fd">FINISHED</text>
  </g>

  <path d="M 196 388 H 284" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 446 388 H 534" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="378" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10">startGame</text>
  <text x="490" y="378" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10">settleRoom</text>

  <text x="960" y="394" text-anchor="end" fill="#64748b" font-family="Consolas, monospace" font-size="10">ставки → банк → выплата</text>
</svg>
